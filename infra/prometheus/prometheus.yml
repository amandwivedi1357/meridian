global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: meridian-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9400"]

  - job_name: meridian-ingestor
    static_configs:
      - targets: ["host.docker.internal:9401"]

  - job_name: meridian-engine
    static_configs:
      - targets: ["host.docker.internal:9402"]

  - job_name: meridian-executor
    static_configs:
      - targets: ["host.docker.internal:9403"]
