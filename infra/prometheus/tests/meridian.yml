rule_files:
  - ../rules/meridian.yml
evaluation_interval: 15s
tests:
  - interval: 15s
    input_series:
      - series: 'up{job="meridian-api",instance="fixture"}'
        values: "0x12"
      - series: 'ws_last_message_age_seconds{service="ingestor"}'
        values: "20x12"
      - series: 'bus_consumer_lag{service="api",stream="signals",group="executor"}'
        values: "1001x12"
      - series: 'kill_switch_active{service="executor"}'
        values: "1x12"
      - series: 'meridian_service_ready{service="api"}'
        values: "0x12"
      - series: 'meridian_dependency_available{service="api",dependency="redis"}'
        values: "0x12"
      - series: 'ingestor_backlog{service="ingestor"}'
        values: "501x12"
      - series: 'ws_reconnects_total{service="ingestor"}'
        values: "0+1x12"
      - series: 'meridian_http_requests_total{service="api",status="429",route="unmatched",method="GET"}'
        values: "0+30x12"
      - series: 'meridian_storage_sample_timestamp_seconds{service="api"}'
        values: "0x12"
    alert_rule_test:
      - eval_time: 15s
        alertname: MeridianMarketStale
        exp_alerts: []
      - eval_time: 3m
        alertname: MeridianScrapeUnavailable
        exp_alerts:
          - exp_labels: { job: meridian-api, instance: fixture, severity: warning }
            exp_annotations: { summary: "Meridian diagnostics unavailable" }
      - eval_time: 3m
        alertname: MeridianMarketStale
        exp_alerts:
          - exp_labels: { service: ingestor, severity: critical }
            exp_annotations: { summary: "Public market feed stale or not yet observed" }
      - eval_time: 3m
        alertname: MeridianConsumerLag
        exp_alerts:
          - exp_labels: { service: api, stream: signals, group: executor, severity: warning }
            exp_annotations:
              { summary: "Consumer lag or pending messages above prototype threshold" }
      - eval_time: 3m
        alertname: MeridianKillSwitchEngaged
        exp_alerts:
          - exp_labels: { service: executor, severity: info }
            exp_annotations: { summary: "Execution kill switch engaged; may be intentional" }
      - eval_time: 3m
        alertname: MeridianServiceNotReady
        exp_alerts:
          - exp_labels: { service: api, severity: warning }
            exp_annotations: { summary: "Meridian service not ready" }
      - eval_time: 3m
        alertname: MeridianDependencyUnavailable
        exp_alerts:
          - exp_labels: { service: api, dependency: redis, severity: critical }
            exp_annotations: { summary: "API-observed storage dependency unavailable" }
      - eval_time: 3m
        alertname: MeridianIngestBacklog
        exp_alerts:
          - exp_labels: { service: ingestor, severity: warning }
            exp_annotations: { summary: "Public feed queue above half its capacity" }
      - eval_time: 3m
        alertname: MeridianReconnectStorm
        exp_alerts:
          - exp_labels: { service: ingestor, severity: warning }
            exp_annotations: { summary: "Repeated upstream reconnect attempts" }
      - eval_time: 3m
        alertname: MeridianApiRateLimited
        exp_alerts:
          - exp_labels: { service: api, severity: warning }
            exp_annotations: { summary: "API rate limiting above prototype threshold" }
      - eval_time: 3m
        alertname: MeridianStorageSampleStale
        exp_alerts:
          - exp_labels: { service: api, severity: warning }
            exp_annotations: { summary: "Underlying storage health sample is stale" }
  - interval: 15s
    input_series:
      - series: 'ws_last_message_age_seconds{service="ingestor"}'
        values: "1x12"
      - series: 'bus_consumer_lag{service="api",stream="signals",group="executor"}'
        values: "1000x12"
      - series: 'kill_switch_active{service="executor"}'
        values: "0x12"
    alert_rule_test:
      - eval_time: 3m
        alertname: MeridianMarketStale
        exp_alerts: []
      - eval_time: 3m
        alertname: MeridianConsumerLag
        exp_alerts: []
      - eval_time: 3m
        alertname: MeridianKillSwitchEngaged
        exp_alerts: []
  - interval: 15s
    input_series:
      - series: 'ws_reconnects_total{service="ingestor"}'
        values: "0+1x6 0+1x6"
    alert_rule_test:
      - eval_time: 3m
        alertname: MeridianReconnectStorm
        exp_alerts:
          - exp_labels: { service: ingestor, severity: warning }
            exp_annotations: { summary: "Repeated upstream reconnect attempts" }
  - interval: 15s
    input_series:
      - series: 'ws_reconnects_total{service="ingestor"}'
        values: "0x12"
    alert_rule_test:
      - eval_time: 3m
        alertname: MeridianReconnectStorm
        exp_alerts: []
